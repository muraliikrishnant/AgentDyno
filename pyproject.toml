[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdyno"
version = "0.1.0"
description = "Inference-aware coding-agent harness lab: measures task success against TTFT/ITL/throughput/cost across swappable harness architectures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentDyno contributors" }]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "streamlit>=1.32",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentdyno = "agentdyno.cli:app"

[tool.setuptools.packages.find]
include = ["agentdyno*"]
