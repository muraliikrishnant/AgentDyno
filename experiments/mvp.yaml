# Only the `single` orchestration is implemented today (subagents/plan_execute
# are structural stubs, see agentdyno/harness/orchestration/). Tier -> model ID
# mapping lives in agentdyno/gateway/models.py (confirmed against the live
# Nebius Token Factory catalog on 2026-09-19). With AGENTDYNO_BACKEND=mock
# (default) tiers select MockModelBackend latency profiles instead.

architectures:
  - single

tasks:
  - experiments/tasks/task1_fix_add
  - experiments/tasks/task2_fix_reverse
  - experiments/tasks/task3_fix_fizzbuzz
  - experiments/tasks/task4_fix_dedupe
  - experiments/tasks/task5_fix_sort

model_tiers:
  - nano
  - super

seeds:
  - 1
  - 2

gateway_url: "http://127.0.0.1:8000/v1/chat/completions"
max_steps: 4
timeout_s: 20
